
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products — Kadai</title>
  <meta name="description" content="Explore products across categories on Kadai, with clear prices, availability and convenient ordering." />
  <link rel="icon" type="image/png" href="assets/kadai-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body class="overflow-x-hidden" data-page="products">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header"></header>
    <main id="main" class="site-main min-w-0">
      <div class="container min-w-0">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <ol><li><a href="index.html">Home</a></li><li aria-current="page">Products</li></ol>
        </nav>

        <div class="page-head js-page-head">
          <h1>All products</h1>
          <p class="page-head__lede">Explore products across categories with clear prices and live availability.</p>
        </div>

        <div class="listing-layout">
          <section aria-label="Product results">
            <div class="toolbar">
              <div class="toolbar__start">
                <button type="button" class="btn btn--secondary btn--sm filters-toggle js-filters-toggle" aria-expanded="false" aria-controls="filters-panel">
                  <svg class="icon icon-filter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                  </svg>
                  <span>Filters</span>
                  <span class="filters-count-badge js-filters-count-badge" hidden></span>
                </button>
                <p class="count js-count" role="status">Loading…</p>
              </div>
              <div class="toolbar__end">
                <label class="u-visually-hidden" for="sort">Sort products</label>
                <select id="sort" class="js-sort">
                  <option value="featured">Recommended</option>
                  <option value="newest">Newest first</option>
                  <option value="price-asc">Price: low to high</option>
                  <option value="price-desc">Price: high to low</option>
                </select>
              </div>
            </div>

            <aside class="filters-panel js-filters-panel" id="filters-panel" aria-label="Filters">
              <!-- filter groups rendered by page module -->
            </aside>

            <div class="active-filters js-active-filters"></div>
            <div class="js-results">
              <!-- skeletons / grid / empty / error land here -->
            </div>
            <div class="load-more js-load-more"></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="site-footer"></footer>
  </div>
</body>
</html>
