
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Kadai</title>
  <meta name="description" content="Request a password reset link." />
  <link rel="icon" type="image/png" href="assets/kadai-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body class="overflow-x-hidden" data-page="forgot">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header"></header>
    <main id="main" class="site-main min-w-0">
      <div class="auth-card">
        <h1>Reset password</h1>
        <p class="auth-sub">We'll email you a reset link.</p>
        <form class="js-forgot" novalidate>
          <div class="field">
            <label for="fp-email">Email</label>
            <input id="fp-email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <p class="form-banner js-form-result" role="status" hidden></p>
          <button type="submit" class="btn btn--block js-submit">Send reset link</button>
        </form>
        <p class="auth-alt"><a href="login.html">Back to sign in</a></p>
      </div>
    </main>
    <footer class="site-footer"></footer>
  </div>
</body>
</html>
