
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Kadai</title>
  <meta name="description" content="Sign in to your Kadai account." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body class="overflow-x-hidden" data-page="login">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header"></header>
    <main id="main" class="site-main min-w-0">
      <div class="auth-card">
        <h1>Sign in</h1>
        <p class="auth-sub">Orders, addresses and your wishlist — all in one place.</p>

        <form class="js-login" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <div class="field js-password-field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" />
            <p class="field-error" data-error-for="password"></p>
          </div>
          <p class="form-banner error-state--inline js-form-error" role="alert" hidden></p>
          <button type="submit" class="btn btn--block js-submit">Sign in</button>
        </form>

        <p class="demo-auth-note js-demo-note" hidden>
          Demo mode: accounts on this device are passwordless. Just enter your email —
          connect Firebase for real password sign-in.
        </p>

        <p class="auth-alt">New here? <a href="register.html">Create an account</a><br />
          <a href="forgot.html">Forgot your password?</a></p>
      </div>
    </main>
    <footer class="site-footer"></footer>
  </div>
</body>
</html>
